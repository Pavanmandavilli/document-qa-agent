services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: document_qa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432" # local access only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d document_qa"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      # Keep credentials separate; SQLAlchemy URL.create safely escapes the password.
      DATABASE_URL: ""
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: document_qa
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      LOG_FILE: /app/logs/app.log
      DOCUMENTS_DIR: /docs
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./docs:/docs
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
